name: Odd Saint — Generate Daily Tickets

# Two triggers a day so each tier releases in two staggered slots. Each batch
# becomes visible ONE HOUR after generation (AVAILABILITY_DELAY_MS in
# scripts/generate-tickets.mjs), so:
#   03:00 UTC (06:00 EAT) -> visible 04:00 UTC = 07:00 EAT
#   09:00 UTC (12:00 EAT) -> visible 10:00 UTC = 13:00 EAT (1pm)
# GitHub cron is ALWAYS UTC and scheduled runs can start several minutes late;
# MIN_HOURS_BETWEEN_SLOTS (5) is kept below the 6h spacing so jitter can never
# make the second run skip itself. Can also be triggered manually.
on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Generate today's tickets
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-tickets.mjs
