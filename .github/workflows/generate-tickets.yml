name: Odd Saint — Generate Daily Tickets

# Tickets are generated ahead of their fixed release times (03:00 and 09:00 UTC =
# 06:00 and 12:00 EAT; see RELEASE_SLOT_HOURS_UTC in scripts/generate-tickets.mjs and
# src/lib/dataFetcher.ts), so a late GitHub start still releases on time.
#
# WHY SO MANY CRON LINES: GitHub's scheduled runs are best-effort — they are often
# delayed by hours at busy times (top of the hour is the worst) and are occasionally
# dropped. So each slot has a primary run at an off-peak minute plus catch-up retries.
# The script is safe to run repeatedly: it skips a tier that already has today's slot
# filled, or (for slot 1) before 06:00 UTC, so a retry that
# isn't needed does nothing. No manual runs should be necessary.
#   Slot 0 (released 03:00 UTC): 00:13 primary, retries 01:43 and 03:13
#   Slot 1 (released 09:00 UTC): 06:23 primary, retries 07:53 and 09:23
# Can still be triggered manually (workflow_dispatch) if ever wanted.
on:
  schedule:
    - cron: '13 0 * * *'
    - cron: '43 1 * * *'
    - cron: '13 3 * * *'
    - cron: '23 6 * * *'
    - cron: '53 7 * * *'
    - cron: '23 9 * * *'
  workflow_dispatch: {}

# Never run two generations at once (a retry must wait for the one in progress).
concurrency:
  group: generate-tickets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Generate today's tickets
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional repo variable (Settings > Secrets and variables > Actions > Variables):
          # comma-separated API-Football bookmaker IDs. Only matches these bookmakers offer are used.
          TARGET_BOOKMAKER_IDS: ${{ vars.TARGET_BOOKMAKER_IDS }}
        run: node scripts/generate-tickets.mjs
