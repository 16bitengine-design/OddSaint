name: Odd Saint — Generate Daily Tickets

# Two triggers a day so each tier's tickets release at staggered times
# rather than all at once — see MIN_HOURS_BETWEEN_SLOTS in
# scripts/generate-tickets.mjs, which enforces the real gap between a
# tier's 1st and 2nd slip of the day regardless of exactly when these
# crons fire. Can also be triggered manually from the Actions tab.
#
# 03:00 UTC = 06:00 East Africa Time (EAT, UTC+3, no DST)
# 10:00 UTC = 13:00 East Africa Time
on:
  schedule:
    - cron: '0 3 * * *'   # slot 0 — 6am EAT morning batch
    - cron: '0 10 * * *'  # slot 1 — 1pm EAT afternoon batch
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Generate today's tickets
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-tickets.mjs
