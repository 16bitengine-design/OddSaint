name: Odd Saint — Weekly Maintenance Sweep

# Runs every Monday at 03:00 UTC. Can also be triggered manually from the
# Actions tab for on-demand runs.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # IMPORTANT: must be false. actions/checkout otherwise persists its
          # own Authorization header into the local git config
          # (http.https://github.com/.extraheader). create-pull-request below
          # ALSO configures its own auth using the `token` input — with both
          # present, git sends two Authorization headers on the same request
          # and GitHub rejects it outright:
          #   remote: Duplicate header: "Authorization"
          #   fatal: ... The requested URL returned error: 400
          # This surfaces during create-pull-request's "Checking the base
          # repository state" step (`git remote prune origin`), NOT during
          # checkout itself, which is why the job gets all the way through
          # dependency updates/lint/build before failing.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Repository layout sweep
        run: |
          echo "## Repository file inventory" >> "$GITHUB_STEP_SUMMARY"
          find . -type f \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './.next/*' \
            | sort >> "$GITHUB_STEP_SUMMARY"

      - name: Dependency audit (report only)
        run: |
          npm outdated || true
          npm audit --audit-level=high || true

      - name: Apply safe, non-breaking dependency updates
        run: |
          npx npm-check-updates -u --target minor
          npm install

      - name: Run lint and build to verify the update is safe
        run: |
          npm run lint --if-present || true
          npm run build --if-present

      - name: Open a pull request with any changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: weekly dependency maintenance sweep'
          title: 'Weekly maintenance: dependency updates'
          body: |
            Automated weekly sweep results:
            - Ran `npm outdated` / `npm audit` (see workflow logs)
            - Applied safe minor/patch dependency updates
            - Verified `lint` and `build` still pass

            Please review before merging — this PR does not auto-merge.
          branch: chore/weekly-maintenance-sweep
          delete-branch: true
