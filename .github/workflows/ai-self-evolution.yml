name: Odd Saint — Weekly Maintenance Sweep

# Runs every Monday at 03:00 UTC. Can also be triggered manually from the
# Actions tab for on-demand runs.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Primary fix: don't let checkout persist its own Authorization
          # header into local git config. peter-evans/create-pull-request
          # configures its own auth when it pushes — if checkout ALSO
          # leaves one behind, git sends two Authorization headers on the
          # same request and GitHub rejects it with a 400:
          #   remote: Duplicate header: "Authorization"
          #   fatal: ... The requested URL returned error: 400
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Repository layout sweep
        run: |
          echo "## Repository file inventory" >> "$GITHUB_STEP_SUMMARY"
          find . -type f \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './.next/*' \
            | sort >> "$GITHUB_STEP_SUMMARY"

      - name: Dependency audit (report only)
        run: |
          npm outdated || true
          npm audit --audit-level=high || true

      - name: Apply safe, non-breaking dependency updates
        run: |
          npx npm-check-updates -u --target minor
          npm install

      - name: Run lint and build to verify the update is safe
        run: |
          npm run lint --if-present || true
          npm run build --if-present

      - name: Clear any leftover git auth header (belt-and-suspenders)
        # Defensive step: even with persist-credentials: false above, some
        # combination of actions/runner behavior, re-run caching, or another
        # step in this job can leave a stale
        # http.https://github.com/.extraheader entry in the LOCAL repo git
        # config, which then collides with the Authorization header
        # peter-evans/create-pull-request sets when it pushes — producing
        # the same "Duplicate header: Authorization" / 400 error. This step
        # unconditionally removes any such leftover entry immediately
        # before the PR step runs, so create-pull-request is guaranteed to
        # be the only thing setting auth. `|| true` because on a clean run
        # there may be nothing to unset, which would otherwise exit non-zero
        # and fail the job.
        run: git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Open a pull request with any changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: weekly dependency maintenance sweep'
          title: 'Weekly maintenance: dependency updates'
          body: |
            Automated weekly sweep results:
            - Ran `npm outdated` / `npm audit` (see workflow logs)
            - Applied safe minor/patch dependency updates
            - Verified `lint` and `build` still pass

            Please review before merging — this PR does not auto-merge.
          branch: chore/weekly-maintenance-sweep
          delete-branch: true
