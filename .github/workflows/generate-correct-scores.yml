name: Odd Saint — Correct Score Predictions

# Every 3 hours at :45 — grades finished predictions, then generates
# predictions for today's fixtures that don't have one yet (each run only
# adds NEW fixtures; existing predictions are never rewritten). Offset to
# :45 so it never lands on grade-tickets.yml's :15 or the generate-tickets
# 03:00/10:00 UTC slots — all of them share the same API-Football quota.
# Costs ~2 API-Football requests per run. Can also be run manually.
on:
  schedule:
    - cron: '45 */3 * * *'
  workflow_dispatch: {}

jobs:
  correct-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Grade and generate correct-score predictions
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-correct-scores.mjs
